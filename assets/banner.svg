<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes scanTick {
      0%, 100% { fill: #38bdf8; }
      50% { fill: #a855f7; }
    }
    @keyframes slideBg {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 60; }
    }
    .card-1 { animation: pulseCard 4s ease-in-out infinite; }
    .card-2 { animation: pulseCard 4s ease-in-out infinite 1.3s; }
    .card-3 { animation: pulseCard 4s ease-in-out infinite 2.6s; }
    .blinking-led { animation: blinkLed 1.5s ease-in-out infinite; }
    .scan-text { animation: scanTick 6s infinite; }
    .grid-pattern { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 6, 6; animation: slideBg 12s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Backing -->
  <line x1="0" y1="90" x2="1200" y2="90" class="grid-pattern" opacity="0.4" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid-pattern" opacity="0.4" />
  <line x1="0" y1="270" x2="1200" y2="270" class="grid-pattern" opacity="0.4" />
  <line x1="300" y1="0" x2="300" y2="360" class="grid-pattern" opacity="0.4" />
  <line x1="600" y1="0" x2="600" y2="360" class="grid-pattern" opacity="0.4" />
  <line x1="900" y1="0" x2="900" y2="360" class="grid-pattern" opacity="0.4" />

  <!-- Top Navigation / Inspector Header Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0f172a" fill-opacity="0.9" />
  <line x1="0" y1="70" x2="1200" y2="70" stroke="#334155" stroke-width="1.5" />

  <!-- Live Status Beacon -->
  <circle cx="45" cy="35" r="7" fill="#38bdf8" class="blinking-led" filter="url(#glowCyan)" />
  <circle cx="45" cy="35" r="3" fill="#ffffff" />
  
  <text x="65" y="40" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">DOM &amp; UI INSPECTOR DEVTOOLS</text>

  <!-- Station Tabs in Bar -->
  <rect x="360" y="20" width="95" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="375" y="40" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">ANDROID</text>

  <rect x="465" y="20" width="85" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="495" y="40" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">IOS</text>

  <rect x="560" y="20" width="110" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="575" y="40" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">APPIUM / RN</text>

  <rect x="680" y="20" width="130" height="30" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
  <text x="696" y="40" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">CLOUD LABS</text>

  <!-- Title & Category Info (Foreground Hero) -->
  <text x="600" y="125" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1">AWESOME MOBILE DOM &amp; UI INSPECTOR</text>
  <text x="600" y="152" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5">Curated Directory of Mobile View Hierarchy Debuggers, XPath Locators &amp; UI Inspection Tools</text>

  <!-- 3 Dynamic Inspector Cards -->
  <!-- Card 1: View Hierarchy Explorer -->
  <g class="card-1" transform="translate(60, 175)" filter="url(#shadow)">
    <rect width="320" height="155" rx="10" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 310 0 C 315.5 0 320 4.5 320 10 L 320 32 L 0 32 Z" fill="#0284c7" />
    <text x="12" y="21" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">#NODE • HIERARCHY TREE</text>
    <text x="245" y="21" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">DEPTH: 4</text>
    
    <text x="14" y="55" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">&lt;ViewGroup id="main_layout"&gt;</text>
    <text x="28" y="73" fill="#94a3b8" font-family="sans-serif" font-size="11">↳ &lt;FrameLayout bounds="[0,0][1080,2400]"&gt;</text>
    <text x="14" y="94" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">&lt;Button id="login_btn" clickable="true"&gt;</text>
    <text x="28" y="112" fill="#94a3b8" font-family="sans-serif" font-size="11">↳ text="Continue with Google"</text>

    <rect x="210" y="122" width="98" height="24" rx="5" fill="#0ea5e9" />
    <text x="230" y="138" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">INSPECTED</text>
  </g>

  <!-- Card 2: XPath & Locator Generator -->
  <g class="card-2" transform="translate(440, 175)" filter="url(#shadow)">
    <rect width="320" height="155" rx="10" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.5" />
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 310 0 C 315.5 0 320 4.5 320 10 L 320 32 L 0 32 Z" fill="#7e22ce" />
    <text x="12" y="21" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">#LOCATOR • SMART XPATH</text>
    <text x="245" y="21" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" class="scan-text">⚡ 100%</text>
    
    <text x="14" y="55" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">XPath: //*[@resource-id="login_btn"]</text>
    <text x="28" y="73" fill="#c084fc" font-family="sans-serif" font-size="11">★ Unique Selector Generated</text>
    <text x="14" y="94" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">iOS: **[`label == "Continue"`]</text>
    <text x="28" y="112" fill="#94a3b8" font-family="sans-serif" font-size="11">↳ ClassChain Match</text>

    <rect x="225" y="122" width="83" height="24" rx="5" fill="#a855f7" />
    <text x="238" y="138" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">COPIED</text>
  </g>

  <!-- Card 3: Cloud & Real-Device Sync -->
  <g class="card-3" transform="translate(820, 175)" filter="url(#shadow)">
    <rect width="320" height="155" rx="10" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5" />
    <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 310 0 C 315.5 0 320 4.5 320 10 L 320 32 L 0 32 Z" fill="#059669" />
    <text x="12" y="21" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">#DEVICE • LIVE STREAM</text>
    <text x="245" y="21" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">✓ 60 FPS</text>
    
    <text x="14" y="55" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">Pixel 8 Pro • Android 14</text>
    <text x="28" y="73" fill="#64748b" font-family="sans-serif" font-size="11">✓ Touch &amp; Gestures Active</text>
    <text x="14" y="94" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="600">iPhone 15 Pro • iOS 17.4</text>
    <text x="28" y="112" fill="#64748b" font-family="sans-serif" font-size="11">✓ Appium Server Connected</text>

    <rect x="235" y="122" width="73" height="24" rx="5" fill="#10b981" />
    <text x="248" y="138" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">ONLINE</text>
  </g>
</svg>
