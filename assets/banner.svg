<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(180px); opacity: 0.2; }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -40; }
    }
    .floating-card-1 {
      animation: float1 7s ease-in-out infinite;
      transform-origin: center;
    }
    .floating-card-2 {
      animation: float2 8s ease-in-out infinite;
      transform-origin: center;
    }
    .pulsing-orb {
      animation: pulseGlow 5s ease-in-out infinite;
      transform-origin: center;
    }
    .scanner-line {
      animation: scanline 4s linear infinite;
    }
    .dashed-wire {
      stroke-dasharray: 6, 6;
      animation: waveDash 3s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .code-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Background Animated Luminous Orbs -->
  <circle cx="200" cy="180" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.12" class="pulsing-orb" />
  <circle cx="1020" cy="160" r="160" fill="#818cf8" filter="url(#glow)" opacity="0.15" class="pulsing-orb" style="animation-delay: -2.5s;" />

  <!-- Background Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.35">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="180" y1="0" x2="180" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1020" y1="0" x2="1020" y2="360" />
    <line x1="1140" y1="0" x2="1140" y2="360" />
    <line x1="0" y1="72" x2="1200" y2="72" />
    <line x1="0" y1="144" x2="1200" y2="144" />
    <line x1="0" y1="216" x2="1200" y2="216" />
    <line x1="0" y1="288" x2="1200" y2="288" />
  </g>

  <!-- DYNAMIC ELEMENT 1: Left Background Floating Device Wireframe (Behind text) -->
  <g class="floating-card-1" opacity="0.75">
    <!-- Phone outline -->
    <rect x="70" y="55" width="150" height="250" rx="22" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
    <rect x="115" y="65" width="60" height="6" rx="3" fill="#334155" />
    <!-- Screen View Hierarchy Nodes -->
    <rect x="85" y="85" width="120" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" />
    <text x="95" y="104" fill="#38bdf8" class="code-text">&lt;View id="header"&gt;</text>
    
    <rect x="85" y="125" width="120" height="48" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <text x="95" y="145" fill="#a5b4fc" class="code-text">&lt;Button bounds="..."&gt;</text>
    <text x="95" y="160" fill="#64748b" class="code-text">text="Continue"</text>

    <rect x="85" y="183" width="120" height="85" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2" stroke-dasharray="2,2" />
    <text x="95" y="202" fill="#34d399" class="code-text">&lt;RecyclerView&gt;</text>
    <circle cx="102" cy="225" r="8" fill="#0284c7" opacity="0.4" />
    <line x1="118" y1="222" x2="185" y2="222" stroke="#475569" stroke-width="3" stroke-linecap="round" />
    <line x1="118" y1="230" x2="165" y2="230" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="102" cy="250" r="8" fill="#a855f7" opacity="0.4" />
    <line x1="118" y1="247" x2="185" y2="247" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Animated Scanner Beam inside Phone Screen -->
    <line x1="80" y1="80" x2="210" y2="80" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" class="scanner-line" />
  </g>

  <!-- DYNAMIC ELEMENT 2: Right Background Floating Inspector HUD & Locators -->
  <g class="floating-card-2" opacity="0.82">
    <!-- Inspector Inspector Card -->
    <rect x="940" y="55" width="200" height="245" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.8" />
    <rect x="940" y="55" width="200" height="28" rx="14" fill="#1e1b4b" />
    <circle cx="958" cy="69" r="4.5" fill="#ef4444" />
    <circle cx="972" cy="69" r="4.5" fill="#eab308" />
    <circle cx="986" cy="69" r="4.5" fill="#22c55e" />
    <text x="1005" y="73" fill="#cbd5e1" class="code-text" font-weight="bold">DOM Inspector</text>

    <!-- Node Properties Tree -->
    <text x="955" y="105" fill="#94a3b8" class="code-text">• resource-id: btn_submit</text>
    <text x="955" y="125" fill="#38bdf8" class="code-text">• accessibility-id: Submit</text>
    <text x="955" y="145" fill="#94a3b8" class="code-text">• clickable: true</text>
    <text x="955" y="165" fill="#94a3b8" class="code-text">• bounds: [120,450][960,570]</text>

    <line x1="955" y1="180" x2="1125" y2="180" stroke="#334155" stroke-width="1" />

    <!-- Computed Locators Pills -->
    <rect x="955" y="195" width="170" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="963" y="211" fill="#38bdf8" class="code-text">XPath: //*[@id='login']</text>

    <rect x="955" y="227" width="170" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="963" y="243" fill="#c084fc" class="code-text">uiautomator: text("Go")</text>

    <rect x="955" y="259" width="170" height="24" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="963" y="275" fill="#34d399" class="code-text">iOS: **[`label == "OK"`]</text>
  </g>

  <!-- Connective Dynamic Dashed Circuit Lines -->
  <path d="M 220 180 Q 270 140, 310 180" fill="none" stroke="#0284c7" stroke-width="1.5" class="dashed-wire" opacity="0.5" />
  <path d="M 890 180 Q 915 220, 940 180" fill="none" stroke="#6366f1" stroke-width="1.5" class="dashed-wire" opacity="0.5" />

  <!-- FOREGROUND HERO CONTENT (Always on top, crisp readability) -->
  <g>
    <!-- Top Micro Tag Pill -->
    <g transform="translate(425, 42)">
      <rect width="350" height="30" rx="15" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.5" />
      <circle cx="20" cy="15" r="4.5" fill="#38bdf8" class="pulsing-orb" />
      <text x="35" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">
        ⚡ CURATED MOBILE DEVTOOLS &amp; QA PLATFORMS
      </text>
    </g>

    <!-- Main Title with Gradient fill and drop shadow -->
    <text x="600" y="128" text-anchor="middle" fill="url(#accentGrad)" class="title-text" font-size="40" filter="url(#glow)">
      Awesome Mobile DOM &amp; UI Element Inspector
    </text>
    <text x="600" y="128" text-anchor="middle" fill="#ffffff" class="title-text" font-size="40">
      Awesome Mobile DOM &amp; UI Element Inspector
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="172" text-anchor="middle" fill="#f8fafc" class="subtitle-text" font-size="17">
      The definitive directory of View Hierarchy Inspectors, XPath Finders &amp; UI Debuggers
    </text>

    <!-- Subtitle Line 2 -->
    <text x="600" y="200" text-anchor="middle" fill="#94a3b8" class="subtitle-text" font-size="14">
      Real-Device Cloud Testing Suites • Local Open-Source Workbenches • On-Device Runtime Tools
    </text>

    <!-- Interactive Badges / Framework Badges in Foreground -->
    <g transform="translate(325, 230)">
      <!-- Pill 1: Android -->
      <rect x="0" y="0" width="125" height="34" rx="8" fill="url(#pillGrad3)" stroke="#10b981" stroke-width="1.2" />
      <text x="62" y="22" text-anchor="middle" fill="#6ee7b7" class="subtitle-text" font-size="13" font-weight="600">🤖 Android</text>

      <!-- Pill 2: iOS -->
      <rect x="140" y="0" width="125" height="34" rx="8" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" />
      <text x="202" y="22" text-anchor="middle" fill="#7dd3fc" class="subtitle-text" font-size="13" font-weight="600">🍎 Apple iOS</text>

      <!-- Pill 3: Appium & Cross-Platform -->
      <rect x="280" y="0" width="135" height="34" rx="8" fill="url(#pillGrad2)" stroke="#a855f7" stroke-width="1.2" />
      <text x="347" y="22" text-anchor="middle" fill="#d8b4fe" class="subtitle-text" font-size="13" font-weight="600">⚡ Appium / RN</text>

      <!-- Pill 4: HarmonyOS -->
      <rect x="430" y="0" width="125" height="34" rx="8" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1.2" />
      <text x="492" y="22" text-anchor="middle" fill="#c7d2fe" class="subtitle-text" font-size="13" font-weight="600">🌐 HarmonyOS</text>
    </g>

    <!-- Bottom Feature Highlights Strip -->
    <g transform="translate(300, 285)">
      <text x="300" y="20" text-anchor="middle" fill="#64748b" class="code-text" font-size="12">
        XPath Generation • Live Device Mirroring • 2D/3D Hierarchy • Style Editing • Automated QA
      </text>
    </g>
  </g>
</svg>
